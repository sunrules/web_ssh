<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web SSH Client</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
</head>
<body>
    <div class="container">
        <div id="login-form" class="login-form">
            <h2>WebSSH Terminal</h2>
<p class="version-info" style="font-size:0.75em;">DoH IPv6+uTLS/SNI → DoH IPv4+uTLS/SNI → ChaCha20 → Plain SSH → Direct IPs</p>
            <form id="ssh-form">
                <input type="text" id="host" placeholder="Host (e.g., localhost)" value="localhost" required>
                <input type="number" id="port" placeholder="Port" value="2222" required>
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Connect</button>
            </form>
        </div>
        
        <div id="terminal-container" style="display:none;">
            <div class="terminal-header">
                <span id="connection-info"></span>
                <span class="selection-hint" title="Зажмите Shift и выделите текст мышью для копирования">⟐ Shift+выделение</span>
                <button id="disconnect-btn">Disconnect</button>
            </div>
            <div id="terminal"></div>
            <div class="clipboard-notification" id="clipboard-notification">
                Copied to clipboard!
            </div>
        </div>
    </div>
    
    <!-- xterm.js (можно self-host: скачайте lib/xterm.js, lib/xterm-addon-fit.js, css/xterm.css с https://github.com/xtermjs/xterm.js/releases/tag/v5.3.0 и положите в static/) -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="/script.js?v=4"></script>
</body>
</html>
